# Hält das Supabase-Projekt wach: Free-Tier-Projekte werden nach 7 Tagen
# ohne Aktivität pausiert. Diese Action liest alle 3 Tage eine Zeile aus
# der Tabelle "ratings" – eine echte Datenbankabfrage zählt als Aktivität.
#
# URL und anon-Key sind dieselben wie in ratings.js. Der anon-Key ist
# öffentlich (er steht ohnehin im ausgelieferten JavaScript), darum kein Secret.

name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"   # alle 3 Tage um 6:17 UTC
  workflow_dispatch:          # zusätzlich per Hand auslösbar (Tab "Actions")

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://edvhweqsaydmxmlggdty.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkdmh3ZXFzYXlkbXhtbGdnZHR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzcwMDYsImV4cCI6MjEwMzI1MzAwNn0.ugP5I2APW7xD4ksX35BRqtAWOo55BQlY0Bp_6iCHdW8
    steps:
      - name: Datenbank abfragen
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/ratings?select=recipe_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase hat geantwortet."
