<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rezept — Tutto Bene.</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 5.5 2 10a7 7 0 0 1-2 4.6"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
        </span>
        <div class="header-text">
          <h1><a href="index.html">Tutto Bene<span class="pea">.</span></a></h1>
          <p class="subtitle">vegan gut, alles gut</p>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Zu dunklem Design wechseln">
        <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
        <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
    <svg class="header-wave" viewBox="0 0 1180 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0,20 C 200,45 400,0 590,18 C 780,36 980,0 1180,20 L1180,40 L0,40 Z"></path></svg>
  </header>

  <main class="detail" id="detail">
    <a class="back" href="index.html">&larr; Zurück zur Übersicht</a>
    <p id="loading">Rezept wird geladen &hellip;</p>
  </main>

  <script src="theme.js"></script>
  <script src="ratings.js"></script>
  <script>
    // gleiches Pfannen-Icon wie auf der Übersichtskarte, hier als Favoriten-Umschalter
    const UTENSILS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 5.5 2 10a7 7 0 0 1-2 4.6"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>';

    const WHOLE_NUMBER_UNITS = ['g', 'ml'];
    // alle übrigen Einheiten (kg, l, Stück, TL, EL, Prise, Bund, Zehe, Dose, Packung, Handvoll)
    // werden auf 2 Nachkommastellen gerundet.

    // Pluralform für Einheiten, die sich vom Singular unterscheiden.
    // Fehlt eine Einheit hier, bleibt sie unverändert (TL, EL, Bund, Handvoll, g, kg, ml, l).
    const UNIT_PLURALS = {
      'Stück': 'Stücke',
      'Zehe': 'Zehen',
      'Dose': 'Dosen',
      'Packung': 'Packungen',
      'Prise': 'Prisen',
    };

    // Zutaten, bei denen die Einheit "Stück" in der Anzeige komplett wegfällt,
    // weil der pluralisierte Zutatenname für sich allein steht ("4 Zwiebeln"
    // statt "4 Stück Zwiebel"). Wert = Pluralform des Namens; ist der Name
    // schon Plural oder unveränderlich (z. B. "Paprika"), steht dort derselbe Wert.
    const COUNTABLE_INGREDIENTS = {
      'Zwiebel': 'Zwiebeln',
      'Karotte': 'Karotten',
      'Lorbeerblatt': 'Lorbeerblätter',
      'Frühlingszwiebel': 'Frühlingszwiebeln',
      'Paprika': 'Paprika',
      'Gewürzgurken': 'Gewürzgurken',
    };

    function displayUnit(unit, amount) {
      return amount === 1 ? unit : (UNIT_PLURALS[unit] || unit);
    }

    function getIdParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function formatNumber(number) {
      // deutsches Komma, keine überflüssigen Nachkommastellen
      const rounded = Math.round(number * 100) / 100;
      return rounded.toString().replace('.', ',');
    }

    function roundAmount(amount, unit, factor) {
      const value = amount * factor;
      if (WHOLE_NUMBER_UNITS.includes(unit)) {
        return Math.round(value);
      }
      return Math.round(value * 100) / 100;
    }

    function toTasteText(factor) {
      if (factor === 1) return 'nach Geschmack';
      if (factor === 2) return 'nach Geschmack, doppelt';
      if (factor === 0.5) return 'nach Geschmack, halb';
      if (factor === 3) return 'nach Geschmack, dreifach';
      return `nach Geschmack, ×${formatNumber(factor)}`;
    }

    function ingredientRow(ingredient, factor) {
      let text;
      if (ingredient.amount === null) {
        text = `${ingredient.name} — ${toTasteText(factor)}`;
      } else {
        const amount = roundAmount(ingredient.amount, ingredient.unit, factor);
        const pluralName = COUNTABLE_INGREDIENTS[ingredient.name];
        if (ingredient.unit === 'Stück' && pluralName) {
          const name = amount === 1 ? ingredient.name : pluralName;
          text = `${formatNumber(amount)} ${name}`;
        } else {
          text = `${formatNumber(amount)} ${displayUnit(ingredient.unit, amount)} ${ingredient.name}`;
        }
      }
      if (ingredient.variety) {
        text += ` (${ingredient.variety})`;
      }
      return `<li><span class="ingredient-dot"></span>${text}</li>`;
    }

    function timesRow(recipe) {
      const parts = [
        `<span>Vorbereitung: ${recipe.prepTime} Min</span>`,
        `<span>Kochzeit: ${recipe.cookTime} Min</span>`
      ];
      if (recipe.restTime && recipe.restTime > 0) {
        parts.push(`<span>Ruhezeit: ${recipe.restTime} Min</span>`);
      }
      return parts.join('');
    }

    function sourceBlock(recipe) {
      if (!recipe.source) return '';
      return `
        <p class="source">
          Quelle: <a href="${recipe.source.url}" target="_blank" rel="noopener">${recipe.source.name} &nearr;</a>
        </p>
      `;
    }

    // Liefert Basis-Portionen/-Zeiten/-Küche/-Bild der aktuell gewählten Variante,
    // mit Override durch die entsprechenden Felder der Variante, falls gesetzt.
    function variantBase(recipe, variant) {
      const base = {
        servings: recipe.servings,
        prepTime: recipe.prepTime,
        cookTime: recipe.cookTime,
        restTime: recipe.restTime,
        cuisine: recipe.cuisine,
        image: recipe.image,
      };
      if (!variant) return base;
      for (const field of ['servings', 'prepTime', 'cookTime', 'restTime', 'cuisine', 'image']) {
        if (variant[field] !== undefined && variant[field] !== null) {
          base[field] = variant[field];
        }
      }
      return base;
    }

    // Zutaten der aktiven Variante: variant.ingredients ersetzt die Basisliste
    // komplett (eigener Teig), variant.extraIngredients ergänzt sie nur.
    function variantIngredients(recipe, variant) {
      if (!variant) return recipe.ingredients;
      if (Array.isArray(variant.ingredients)) return variant.ingredients;
      return recipe.ingredients.concat(variant.extraIngredients || []);
    }

    // Schritte der aktiven Variante: gleiches Muster wie bei den Zutaten.
    function variantSteps(recipe, variant) {
      if (!variant) return recipe.steps;
      if (Array.isArray(variant.steps)) return variant.steps;
      return recipe.steps.concat(variant.extraSteps || []);
    }

    function getActiveVariant(recipe, variantName) {
      if (!Array.isArray(recipe.variants)) return null;
      return recipe.variants.find(v => v.name === variantName) || recipe.variants[0] || null;
    }

    function renderIngredients(recipe, servings, variant) {
      const base = variantBase(recipe, variant);
      const factor = servings / base.servings;
      const combined = variantIngredients(recipe, variant);
      const list = combined.map(i => ingredientRow(i, factor)).join('');
      document.getElementById('ingredients-list').innerHTML = list;

      const spices = Array.isArray(recipe.spices) ? recipe.spices : [];
      const spicesSection = document.getElementById('spices-section');
      if (spices.length > 0) {
        const spicesList = spices.map(i => ingredientRow(i, factor)).join('');
        document.getElementById('spices-list').innerHTML = spicesList;
        spicesSection.hidden = false;
      } else {
        spicesSection.hidden = true;
      }
    }

    function renderSteps(recipe, variant) {
      const steps = variantSteps(recipe, variant);
      document.getElementById('steps-timeline').innerHTML = steps.map((s, i) => `
        <div class="step">
          <span class="step-number">${i + 1}</span>
          <p>${s}</p>
        </div>
      `).join('');
    }

    function renderVariantCuisine(recipe, variant) {
      const base = variantBase(recipe, variant);
      const cuisineBadge = document.getElementById('cuisine-badge');
      if (cuisineBadge) cuisineBadge.textContent = base.cuisine;
    }

    function renderVariantImage(recipe, variant) {
      const base = variantBase(recipe, variant);
      const img = document.getElementById('detail-image');
      if (img && base.image) img.src = base.image;
    }

    function renderVariantTimes(recipe, variant) {
      const base = variantBase(recipe, variant);
      document.getElementById('times-row').innerHTML = timesRow(base);
    }

    function starsDisplay(average) {
      const percent = Math.max(0, Math.min(100, (average / 5) * 100));
      return `
        <span class="stars-empty" aria-hidden="true">☆☆☆☆☆</span>
        <span class="stars-filled" aria-hidden="true" style="width: ${percent}%">★★★★★</span>
      `;
    }

    function formatDecimal(number) {
      const rounded = Math.round(number * 10) / 10;
      return rounded.toString().replace('.', ',');
    }

    function relativeStars(clientX, starsEl) {
      // errechnet aus einer Klickposition innerhalb der Sterne-Reihe einen
      // Wert von 0,5 bis 5,0 in 0,5-Schritten (halbe Sterne, siehe Spec E9)
      const rect = starsEl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const raw = ratio * 5;
      return Math.max(0.5, Math.round(raw * 2) / 2);
    }

    function ownRatingRow(ratings) {
      const identity = Ratings.getIdentity();
      if (!identity) return null;
      return ratings.find(r => r.user_email === identity.email) || null;
    }

    function renderRatingBadge(count, average) {
      const badge = document.getElementById('rating-badge');
      if (!count) {
        badge.hidden = true;
        badge.innerHTML = '';
        return;
      }
      badge.hidden = false;
      badge.innerHTML = `
        <span class="stars small">${starsDisplay(average)}</span>
        <span class="rating-badge-value">${formatDecimal(average)}</span>
      `;
    }

    async function renderRatingSection(recipe) {
      const container = document.getElementById('rating-section');
      let ratings = [];
      try {
        ratings = await Ratings.ratingsForRecipe(recipe.id);
      } catch (err) {
        ratings = [];
      }

      const count = ratings.length;
      const average = count ? ratings.reduce((sum, r) => sum + Number(r.stars), 0) / count : 0;
      const own = ownRatingRow(ratings);

      renderRatingBadge(count, average);

      const summaryHtml = count
        ? `<span class="stars">${starsDisplay(average)}</span> ${formatDecimal(average)} (${count} Bewertung${count === 1 ? '' : 'en'})`
        : `<span class="rating-empty">Noch keine Bewertungen.</span>`;

      const listHtml = ratings.map(r => {
        const isOwn = own && r.user_email === own.user_email;
        const commentHtml = r.comment ? `<p class="rating-comment">${escapeHtml(r.comment)}</p>` : '';
        return `
          <li class="rating-entry ${isOwn ? 'own' : ''}">
            <p class="rating-entry-head">
              <strong>${escapeHtml(r.display_name)}</strong>
              <span class="stars small">${starsDisplay(Number(r.stars))}</span>
              <span class="rating-value">${formatDecimal(Number(r.stars))}</span>
            </p>
            ${commentHtml}
          </li>
        `;
      }).join('');

      container.innerHTML = `
        <p class="rating-summary">${summaryHtml}
          ${count ? '<button type="button" class="rating-toggle" id="rating-toggle">Bewertungen anzeigen ▾</button>' : ''}
        </p>
        <ul class="rating-list" id="rating-list" hidden>${listHtml}</ul>

        <div class="own-rating">
          <p class="own-rating-label">Deine Bewertung:</p>
          <div class="stars-input" id="stars-input" role="slider" aria-label="Bewertung in Sternen" tabindex="0">
            <span class="stars-empty" aria-hidden="true">☆☆☆☆☆</span>
            <span class="stars-filled" aria-hidden="true" id="own-stars-filled" style="width: ${own ? (Number(own.stars) / 5) * 100 : 0}%">★★★★★</span>
          </div>
          <textarea id="rating-comment" placeholder="Kurzer Kommentar (optional)" maxlength="500">${own && own.comment ? escapeHtml(own.comment) : ''}</textarea>
          <div class="own-rating-actions">
            <button type="button" class="rating-submit" id="rating-submit">${own ? 'Bewertung ändern' : 'Bewerten'}</button>
            ${own ? '<button type="button" class="rating-delete" id="rating-delete">Bewertung löschen</button>' : ''}
          </div>
        </div>
      `;

      if (count) {
        document.getElementById('rating-toggle').addEventListener('click', () => {
          const list = document.getElementById('rating-list');
          const toggle = document.getElementById('rating-toggle');
          const open = list.hidden;
          list.hidden = !open;
          toggle.textContent = open ? 'Bewertungen ausblenden ▴' : 'Bewertungen anzeigen ▾';
        });
      }

      let pendingStars = own ? Number(own.stars) : 0;
      const starsInput = document.getElementById('stars-input');
      const filledSpan = document.getElementById('own-stars-filled');

      function updateFilled(stars) {
        filledSpan.style.width = `${(stars / 5) * 100}%`;
      }

      starsInput.addEventListener('click', (event) => {
        pendingStars = relativeStars(event.clientX, starsInput);
        updateFilled(pendingStars);
      });
      starsInput.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') { pendingStars = Math.min(5, (pendingStars || 0) + 0.5); updateFilled(pendingStars); }
        if (event.key === 'ArrowLeft') { pendingStars = Math.max(0.5, (pendingStars || 0) - 0.5); updateFilled(pendingStars); }
      });

      document.getElementById('rating-submit').addEventListener('click', async () => {
        if (!pendingStars) {
          alert('Bitte eine Sternebewertung antippen.');
          return;
        }
        const identity = await Ratings.ensureIdentityDialog();
        if (!identity) return;
        const comment = document.getElementById('rating-comment').value.trim();
        try {
          await Ratings.submitRating(recipe.id, pendingStars, comment);
          renderRatingSection(recipe);
        } catch (err) {
          alert('Bewertung konnte nicht gespeichert werden. Bitte später erneut versuchen.');
        }
      });

      const deleteButton = document.getElementById('rating-delete');
      if (deleteButton) {
        deleteButton.addEventListener('click', async () => {
          if (!confirm('Deine Bewertung wirklich löschen?')) return;
          try {
            await Ratings.deleteRating(recipe.id);
            renderRatingSection(recipe);
          } catch (err) {
            alert('Bewertung konnte nicht gelöscht werden. Bitte später erneut versuchen.');
          }
        });
      }
    }

    function overviewUrlWithFilters() {
      let query = '';
      try {
        query = sessionStorage.getItem('tuttobene-overview-query') || '';
      } catch (err) {
        query = '';
      }
      return query ? `index.html?${query}` : 'index.html';
    }

    function wireBackLinks() {
      const url = overviewUrlWithFilters();
      document.querySelectorAll('a.back').forEach((link) => {
        link.setAttribute('href', url);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function setupFavoriteToggle(recipe) {
      const button = document.getElementById('favorite-toggle');
      let ownFavorites = new Set();
      try {
        ownFavorites = await Ratings.ownFavorites();
      } catch (err) {
        ownFavorites = new Set();
      }
      let active = ownFavorites.has(recipe.id);

      function render() {
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active);
        button.setAttribute('aria-label', active ? 'Favorit entfernen' : 'Als Favorit markieren');
      }
      render();

      button.addEventListener('click', async () => {
        const identity = await Ratings.ensureIdentityDialog();
        if (!identity) return;
        const nowActive = !active;
        try {
          await Ratings.setFavorite(recipe.id, nowActive);
          active = nowActive;
          render();
        } catch (err) {
          alert('Favorit konnte nicht gespeichert werden. Bitte später erneut versuchen.');
        }
      });
    }

    async function loadRecipe() {
      const id = getIdParam();
      const container = document.getElementById('detail');
      if (!id) {
        container.innerHTML = '<a class="back" href="index.html">&larr; Zurück zur Übersicht</a><p>Kein Rezept angegeben.</p>';
        wireBackLinks();
        return;
      }

      let recipe;
      try {
        const response = await fetch(`recipes/${id}.json`);
        if (!response.ok) throw new Error('nicht gefunden');
        recipe = await response.json();
      } catch (err) {
        container.innerHTML = '<a class="back" href="index.html">&larr; Zurück zur Übersicht</a><p>Dieses Rezept gibt es nicht (mehr).</p>';
        wireBackLinks();
        return;
      }

      document.title = `${recipe.title} — Tutto Bene.`;

      const image = recipe.image
        ? `<img class="detail-image" id="detail-image" src="${recipe.image}" alt="">`
        : `<div class="card-image-placeholder">kein Bild</div>`;

      const hasVariants = Array.isArray(recipe.variants) && recipe.variants.length > 0;
      const variantSwitcher = hasVariants ? `
        <div class="variant-switcher" id="variant-switcher" role="tablist">
          ${recipe.variants.map((v, i) => `
            <button type="button" class="variant-tab${i === 0 ? ' active' : ''}" data-variant="${escapeHtml(v.name)}" role="tab" aria-selected="${i === 0 ? 'true' : 'false'}">${v.name}</button>
          `).join('')}
        </div>
      ` : '';

      container.innerHTML = `
        <a class="back" href="index.html">&larr; Zurück zur Übersicht</a>
        <div class="detail-image-wrap">
          ${image}
          <button type="button" class="badge-icon favorite-toggle detail-favorite" id="favorite-toggle" aria-label="Als Favorit markieren" aria-pressed="false">${UTENSILS_ICON}</button>
          <div class="rating-badge" id="rating-badge" hidden></div>
        </div>
        <h1>${recipe.title}</h1>
        <div class="badges">
          <span class="badge">${recipe.category}</span>
          <span class="badge cuisine" id="cuisine-badge">${recipe.cuisine}</span>
        </div>
        <p class="times" id="times-row"></p>
        ${variantSwitcher}

        <div class="toolbar">
          <div class="servings">
            <button type="button" id="servings-minus" aria-label="weniger Portionen">&minus;</button>
            <span><span id="servings-count"></span> Portionen</span>
            <button type="button" id="servings-plus" aria-label="mehr Portionen">+</button>
          </div>
          <button type="button" class="cook-mode" id="cook-mode-toggle">Kochmodus: Display an</button>
        </div>

        <div class="content-grid">
          <div class="ingredients">
            <h3>Zutaten</h3>
            <ul id="ingredients-list"></ul>
            <div class="spices" id="spices-section" hidden>
              <h4>Gewürze</h4>
              <ul id="spices-list"></ul>
            </div>
          </div>
          <div class="steps">
            <h3>Zubereitung</h3>
            <div class="steps-timeline" id="steps-timeline"></div>
          </div>
        </div>

        <div class="rating-section" id="rating-section"></div>

        ${sourceBlock(recipe)}
      `;

      let activeVariantName = hasVariants ? recipe.variants[0].name : null;
      let activeVariant = getActiveVariant(recipe, activeVariantName);
      let servings = variantBase(recipe, activeVariant).servings;

      function refresh() {
        document.getElementById('servings-count').textContent = servings;
        renderVariantTimes(recipe, activeVariant);
        renderVariantCuisine(recipe, activeVariant);
        renderVariantImage(recipe, activeVariant);
        renderIngredients(recipe, servings, activeVariant);
        renderSteps(recipe, activeVariant);
      }

      refresh();

      document.getElementById('servings-minus').addEventListener('click', () => {
        if (servings > 1) {
          servings -= 1;
          refresh();
        }
      });
      document.getElementById('servings-plus').addEventListener('click', () => {
        servings += 1;
        refresh();
      });

      if (hasVariants) {
        const switcher = document.getElementById('variant-switcher');
        switcher.addEventListener('click', (event) => {
          const tab = event.target.closest('.variant-tab');
          if (!tab) return;
          switcher.querySelectorAll('.variant-tab').forEach(btn => {
            btn.classList.toggle('active', btn === tab);
            btn.setAttribute('aria-selected', btn === tab ? 'true' : 'false');
          });
          activeVariantName = tab.dataset.variant;
          activeVariant = getActiveVariant(recipe, activeVariantName);
          servings = variantBase(recipe, activeVariant).servings;
          refresh();
        });
      }

      setupCookMode();
      renderRatingSection(recipe);
      setupFavoriteToggle(recipe);
      wireBackLinks();
    }

    function setupCookMode() {
      const toggle = document.getElementById('cook-mode-toggle');
      let wakeLock = null;

      if (!('wakeLock' in navigator)) {
        toggle.disabled = true;
        toggle.title = 'Dein Browser unterstützt das leider nicht.';
        return;
      }

      toggle.addEventListener('click', async () => {
        try {
          if (!wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            toggle.dataset.active = 'true';
            toggle.textContent = 'Kochmodus: Display an ✓';
            wakeLock.addEventListener('release', () => {
              toggle.dataset.active = 'false';
              toggle.textContent = 'Kochmodus: Display an';
              wakeLock = null;
            });
          } else {
            await wakeLock.release();
            wakeLock = null;
          }
        } catch (err) {
          toggle.dataset.active = 'false';
          toggle.textContent = 'Kochmodus: Display an';
        }
      });
    }

    wireBackLinks();
    loadRecipe();
  </script>
</body>
</html>
